# Construye los paquetes COMPLETOS (programa + Python + bibliotecas + modelo de voz «small» + separador)
# para Windows y Linux al publicar una versión, los prueba descomprimidos en una carpeta nueva y los sube
# a la versión con nombre fijo, para que …/releases/latest/download/… dé siempre el último.
# Quien los descarga no necesita instalar nada: se descomprime y se abre.
name: Paquetes completos

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Versión a la que añadir los paquetes (por ejemplo v1.5.0)"
        required: true

permissions:
  contents: write

env:
  ETIQUETA: ${{ github.event.release.tag_name || inputs.etiqueta }}
  GH_TOKEN: ${{ github.token }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ETIQUETA }}
      - name: Python y paquetes dentro de la carpeta
        shell: cmd
        continue-on-error: true
        run: iniciar-windows.bat --si --diagnostico < NUL
      - name: Modelo de voz «small» y separador
        shell: pwsh
        run: |
          $py = (Get-ChildItem runtime/python -Filter python.exe -Recurse -Depth 1 | Select-Object -First 1).FullName
          $env:PYTHONPATH = "$pwd\app;$pwd\runtime\site-app"
          & $py -s -c "from partitura_libre import letras, separacion; letras.descargar_modelo('small'); separacion.descargar()"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compilar PartituraLibre.exe
        shell: cmd
        working-directory: herramientas/windows
        run: |
          rc /nologo /fo icono.res icono.rc || exit /b 1
          cl /nologo /O2 /utf-8 PartituraLibre.c icono.res user32.lib /link /SUBSYSTEM:WINDOWS /OUT:PartituraLibre.exe || exit /b 1
      - name: Montar el paquete (sin .bat)
        shell: pwsh
        run: |
          $d = "paquete\PartituraLibre"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item app, docs, README.md, LICENSE, models -Destination $d -Recurse
          robocopy runtime "$d\runtime" /E /XD uv-cache /NFL /NDL /NJH /NJS | Out-Null
          Copy-Item herramientas\windows\PartituraLibre.exe $d
          foreach ($c in "data", "config", "logs", "temp") { New-Item -ItemType Directory -Force "$d\$c" | Out-Null }
          Get-ChildItem $d -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          exit 0
      - name: Probar el paquete descomprimido en una carpeta nueva
        shell: pwsh
        run: |
          $prueba = Join-Path $env:RUNNER_TEMP "prueba ñ"
          New-Item -ItemType Directory -Force $prueba | Out-Null
          Move-Item paquete\PartituraLibre $prueba
          $d = Join-Path $prueba "PartituraLibre"
          $p = Start-Process -FilePath "$d\PartituraLibre.exe" -ArgumentList "--diagnostico" -Wait -NoNewWindow -PassThru `
               -RedirectStandardOutput "$env:RUNNER_TEMP\diag.txt" -RedirectStandardError "$env:RUNNER_TEMP\diag-err.txt"
          Get-Content "$env:RUNNER_TEMP\diag.txt" -Encoding utf8
          Get-Content "$env:RUNNER_TEMP\diag-err.txt" -Encoding utf8
          if (-not (Select-String -Path "$env:RUNNER_TEMP\diag.txt" -Pattern "Paquetes «app»: se importan" -Encoding utf8)) { throw "El paquete no carga sus bibliotecas" }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\diag.txt" -Pattern "Modelos de voz: .*small" -Encoding utf8)) { throw "Falta el modelo de voz" }
          $env:QT_QPA_PLATFORM = "offscreen"
          Start-Process -FilePath "$d\PartituraLibre.exe"
          Start-Sleep -Seconds 40
          $ventana = Get-Process pythonw -ErrorAction SilentlyContinue
          if (-not $ventana) { Get-Content "$d\logs\*" -ErrorAction SilentlyContinue; throw "La ventana no se abrió" }
          $ventana | Stop-Process -Force
          Start-Sleep -Seconds 3
          foreach ($c in "data", "config", "logs", "temp") { Get-ChildItem "$d\$c" -Force | Remove-Item -Recurse -Force }
          Get-ChildItem $d -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          "CARPETA=$prueba" | Out-File -Append $env:GITHUB_ENV
      - name: Comprimir y subir
        shell: pwsh
        run: |
          Push-Location $env:CARPETA
          7z a -tzip -mx=5 "$env:RUNNER_TEMP\PartituraLibre-windows11-x64.zip" PartituraLibre | Out-Null
          Pop-Location
          gh release upload $env:ETIQUETA "$env:RUNNER_TEMP\PartituraLibre-windows11-x64.zip" --clobber --repo $env:GITHUB_REPOSITORY

  linux:
    runs-on: ubuntu-22.04   # glibc antigua: lo compilado aquí funciona en Debian 13, Ubuntu 22.04/24.04 y posteriores
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ETIQUETA }}
      - name: Herramientas para compilar PortAudio (solo en esta máquina, no van en el paquete)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Python y paquetes dentro de la carpeta
        continue-on-error: true
        run: ./iniciar-linux.sh --si --diagnostico
      - name: PortAudio propio (ALSA, que funciona con PipeWire y PulseAudio)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o pa.tgz https://github.com/PortAudio/portaudio/archive/refs/tags/v19.7.0.tar.gz
          tar xzf pa.tgz && cd portaudio-19.7.0
          ./configure --prefix="$RUNNER_TEMP/pa" --without-jack --without-oss --with-alsa > /dev/null
          make -j4 > /dev/null && make install > /dev/null
          mkdir -p "$GITHUB_WORKSPACE/runtime/lib"
          cp -L "$RUNNER_TEMP/pa/lib/libportaudio.so.2" "$GITHUB_WORKSPACE/runtime/lib/"
      - name: Bibliotecas de la ventana en X11 (no vienen en todas las distribuciones)
        run: |
          mkdir -p "$RUNNER_TEMP/deb" && cd "$RUNNER_TEMP/deb"
          apt-get download libxcb-cursor0 libxcb-image0 libxcb-render-util0 libxcb-util1
          for f in *.deb; do dpkg-deb -x "$f" x; done
          cp -L x/usr/lib/x86_64-linux-gnu/libxcb-cursor.so.0 x/usr/lib/x86_64-linux-gnu/libxcb-image.so.0 \
                x/usr/lib/x86_64-linux-gnu/libxcb-render-util.so.0 x/usr/lib/x86_64-linux-gnu/libxcb-util.so.1 \
                "$GITHUB_WORKSPACE/runtime/lib/"
      - name: Modelo de voz «small» y separador
        run: |
          PY=$(ls -d runtime/python/cpython-3.11*/bin/python3.11 | head -1)
          PYTHONPATH="$PWD/app:$PWD/runtime/site-app" $PY -s -c "from partitura_libre import letras, separacion; letras.descargar_modelo('small'); separacion.descargar()"
      - name: Montar y probar el paquete en una carpeta nueva, sin PortAudio del sistema
        run: |
          if /sbin/ldconfig -p | grep -q libportaudio; then echo "Esta máquina ya tiene PortAudio: la prueba no valdría"; exit 1; fi
          D="$RUNNER_TEMP/prueba ñ/PartituraLibre"
          mkdir -p "$D"
          cp -a app docs README.md LICENSE iniciar-linux.sh models "$D/"
          rsync -a --exclude uv-cache runtime "$D/"
          mkdir -p "$D/data" "$D/config" "$D/logs" "$D/temp"
          find "$D" -name __pycache__ -type d -prune -exec rm -rf {} +
          cd "$D"
          ./iniciar-linux.sh --diagnostico | tee "$RUNNER_TEMP/diag.txt" || true
          grep -q "Paquetes «app»: se importan" "$RUNNER_TEMP/diag.txt"
          grep -q "Sistema de audio: PortAudio" "$RUNNER_TEMP/diag.txt"
          grep -q "Modelos de voz: .*small" "$RUNNER_TEMP/diag.txt"
          set +e; QT_QPA_PLATFORM=offscreen timeout 30 ./iniciar-linux.sh; codigo=$?; set -e
          [ "$codigo" = 124 ] || { echo "La ventana no se quedó abierta (código $codigo)"; cat logs/* 2>/dev/null; exit 1; }
          rm -rf data/* config/* logs/* temp/*
          find . -name __pycache__ -type d -prune -exec rm -rf {} +
      - name: Comprimir y subir
        run: |
          tar -czf "$RUNNER_TEMP/PartituraLibre-linux-x64.tar.gz" -C "$RUNNER_TEMP/prueba ñ" PartituraLibre
          ls -la "$RUNNER_TEMP"/PartituraLibre-linux-x64.tar.gz
          gh release upload "$ETIQUETA" "$RUNNER_TEMP/PartituraLibre-linux-x64.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
